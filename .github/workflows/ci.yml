name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.9 is the floor we support so an older Jetson image still works.
        python-version: ["3.9", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Protocol, firmware and integration tests
        run: python -m unittest discover -s tests -v

      - name: Message-exchange demonstration
        run: python demo.py

      - name: Mock-link harness end to end
        run: python jetson_test.py --mock --duration 3

      - name: Byte-compile every module
        # Catches syntax errors in files no test imports.
        run: python -m compileall -q . -x '\.git'
