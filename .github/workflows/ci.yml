name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  firmware-core:
    name: C++ firmware core
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unit tests (built with -Werror)
        run: make test-cpp

      - name: Build with clang as well
        # A second compiler catches undefined behaviour and portability
        # mistakes that one toolchain happens to tolerate. The Teensy build
        # uses yet another (arm-none-eabi-gcc), so agreement here is a
        # meaningful signal.
        run: make -C tests/cpp clean && CXX=clang++ make -C tests/cpp test

      - name: Sanitizers
        # Signed overflow in the encoder accumulators would be undefined
        # behaviour, not a wrap. UBSan proves wrapI32 actually avoids it.
        run: |
          make -C tests/cpp clean
          CXXFLAGS="-std=c++17 -Wall -Wextra -Werror -O1 -g -fsanitize=undefined,address -fno-sanitize-recover=all" \
            make -C tests/cpp test

  host:
    name: Host side (Jetson)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Host tests (golden vectors + integration against the real firmware)
        run: make test-host
      - name: Message-exchange demonstration
        run: make demo
      - name: Byte-compile every module
        run: python -m compileall -q host tools tests
